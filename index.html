<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming Protocol V.1 | Fohsen</title>
<meta name="theme-color" content="#0d0a14">
<style>html,body{margin:0;padding:0;background:#0d0a14}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
#px{
  --void:#0d0a14; --deep:#161226; --panel:#1e1932; --lift:#2a2444;
  --line:#0a0812; --edge:#4b4173;
  --text:#efe9ff; --dim:#9a8fc4; --faint:#6b6194;
  --live:#7cf29a; --hold:#ffd166; --cold:#6fc3ff; --done:#7a7196; --hot:#ff6b7a;
  background:var(--void); color:var(--text);
  font-family:'VT323',monospace; font-size:19px; line-height:1.35;
  padding:0 0 60px; min-height:100vh;
  image-rendering:pixelated;
  background-image:
    linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
  background-size:4px 4px;
}
#px *{box-sizing:border-box;margin:0;padding:0}
#px .wrap{max-width:1160px;margin:0 auto;padding:0 16px}
#px button{font:inherit;cursor:pointer;color:inherit;background:none;border:none}

/* pixel frame */
#px .fr{
  background:var(--panel); border:3px solid var(--line);
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.05), inset -3px -3px 0 rgba(0,0,0,.45);
}
#px .btn{
  background:var(--lift); border:3px solid var(--line); padding:6px 10px;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.09), inset -2px -2px 0 rgba(0,0,0,.5);
  font-family:'Press Start 2P',monospace; font-size:8px; color:var(--dim);
  text-transform:uppercase; transition:none;
}
#px .btn:hover{color:var(--text);background:#332c52}
#px .btn:active,#px .btn[aria-pressed="true"]{
  box-shadow: inset -2px -2px 0 rgba(255,255,255,.06), inset 2px 2px 0 rgba(0,0,0,.5);
  background:var(--edge); color:#fff;
}
#px .btn[disabled]{opacity:.45;cursor:default}
#px .btn[disabled]:hover{background:var(--lift);color:var(--dim)}

/* header */
#px .hd{border-bottom:3px solid var(--line);background:var(--deep);padding:22px 0 16px;margin-bottom:18px}
#px .hd h1{font-family:'Press Start 2P',monospace;font-size:23px;line-height:1.45;color:var(--hold);
  text-shadow:3px 3px 0 #7a4a00, 6px 6px 0 rgba(0,0,0,.5);margin-bottom:10px}
#px .hd h1 i{font-style:normal;color:var(--edge);text-shadow:3px 3px 0 rgba(0,0,0,.5)}
#px .hd .tag{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--faint);margin-bottom:10px}
#px .xp{margin-top:14px}
#px .xp .lb{display:flex;justify-content:space-between;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);margin-bottom:5px}
#px .xpbar{height:16px;background:var(--void);border:3px solid var(--line);padding:2px}
#px .xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--hold) 0 6px,#e0b44a 6px 8px);width:0;transition:width .3s steps(12)}

/* aviso de almacenamiento */
#px .warn{background:#3a1420;border:3px solid var(--hot);padding:11px 13px;margin-bottom:16px}
#px .warn b{display:block;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--hot);margin-bottom:7px}
#px .warn span{font-size:18px;color:#ffd9de}

/* rotulo de seccion */
#px .sect{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--faint);
  display:flex;align-items:center;gap:9px;margin:0 0 9px}
#px .sect:after{content:'';flex:1;height:3px;background:var(--line)}
#px .sect b{color:var(--dim);font-weight:normal}
#px .sect .btn{font-size:7px;padding:5px 8px}

/* ---------- HERO: experiencia actual ---------- */
#px .dash{margin-bottom:24px}
#px .hero{padding:14px;margin-bottom:20px}
#px .hh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;
  border-bottom:3px solid var(--line);padding-bottom:12px;margin-bottom:13px}
#px .hh .hn{font-family:'Press Start 2P',monospace;font-size:17px;line-height:1.55;color:var(--hold);
  text-shadow:2px 2px 0 rgba(0,0,0,.55)}
#px .hh .hs{font-size:19px;color:var(--dim);margin-top:7px}
#px .hh .hr{margin-left:auto;text-align:right;flex:0 0 auto}
#px .hh .hp{font-family:'Press Start 2P',monospace;font-size:26px;color:var(--live);
  text-shadow:2px 2px 0 rgba(0,0,0,.55)}
#px .hh .hl{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--faint);margin-top:8px}
#px .hero .empty{color:var(--faint);font-size:18px;padding:12px 2px}
#px .hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
#px .blk{margin-bottom:16px}
#px .blk:last-child{margin-bottom:0}
#px .ttl{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--faint);margin:0 0 8px}
#px .bigbar{height:22px;background:var(--void);border:3px solid var(--line);padding:2px;margin-bottom:9px}
#px .bigbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--hold) 0 6px,#e0b44a 6px 8px)}
#px .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#px .ctl .pc{font-family:'Press Start 2P',monospace;font-size:9px;min-width:44px;text-align:center;color:var(--hold)}
#px .mv{display:flex;gap:5px;flex-wrap:wrap}

/* ficha estructurada */
#px .ficha{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
#px .fld{background:var(--void);border:2px solid var(--line);padding:6px 7px}
#px .fld b{display:block;font-family:'Press Start 2P',monospace;font-size:6px;color:var(--faint);
  font-weight:normal;margin-bottom:5px;line-height:1.5}
#px .fld input{width:100%;background:none;border:none;color:var(--text);
  font-family:'VT323',monospace;font-size:18px;padding:0}
#px .fld input:focus{outline:none;color:var(--hold)}
#px .fld input::placeholder{color:var(--faint)}

/* nota personal */
#px .score{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#px .sqs{display:flex;gap:3px}
#px .sq{width:19px;height:19px;background:var(--void);border:2px solid var(--line);padding:0}
#px .sq.on{background:var(--hold);box-shadow:inset 2px 2px 0 rgba(255,255,255,.25)}
#px .sq:hover{border-color:var(--edge)}
#px .sv{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--hold);min-width:52px}
#px .sv.none{color:var(--faint);font-size:8px}

/* estadisticas */
#px .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
#px .stat{background:var(--void);border:2px solid var(--line);padding:7px 8px;position:relative}
#px .stat b{display:block;font-family:'Press Start 2P',monospace;font-size:6px;color:var(--faint);
  font-weight:normal;margin-bottom:6px;line-height:1.5}
#px .stat span{font-size:18px;color:var(--text);word-break:break-word}
#px .stat .rm{position:absolute;top:1px;right:3px;font-size:16px;color:var(--faint);line-height:1}
#px .stat .rm:hover{color:var(--hot)}

/* enlaces */
#px .lks{display:flex;gap:6px;flex-wrap:wrap}
#px .lk{display:inline-flex;align-items:center;gap:7px;background:var(--lift);border:3px solid var(--line);padding:6px 8px;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.09), inset -2px -2px 0 rgba(0,0,0,.5)}
#px .lk a{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--cold);text-decoration:none}
#px .lk a:hover{color:#fff;text-decoration:underline}
#px .lk .rm{font-size:16px;color:var(--faint);line-height:1}
#px .lk .rm:hover{color:var(--hot)}
#px .none{color:var(--faint);font-size:17px}

/* mini formularios */
#px .mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
#px .mini input{flex:1;min-width:88px;background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:17px;padding:5px 7px}
#px .mini input:focus{outline:none;border-color:var(--edge)}
#px .hero textarea{width:100%;min-height:82px;background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:18px;line-height:1.35;padding:7px 8px;resize:vertical}
#px .hero textarea:focus{outline:none;border-color:var(--edge)}

/* mundos recientes */
#px .worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:7px}
#px .world{padding:8px;cursor:pointer;text-align:left;display:block;width:100%}
#px .world.on{border-color:var(--hold)}
#px .world .wn{font-family:'Press Start 2P',monospace;font-size:6px;line-height:1.8;margin-bottom:5px}
#px .world .wm{font-size:15px;color:var(--faint)}
#px .world .wb{height:8px;background:var(--void);border:2px solid var(--line);margin-top:6px;padding:1px}
#px .world .wb i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--cold) 0 4px,transparent 4px 6px)}

/* ---------- BACKLOG ---------- */
#px .frow{margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#px .frow>.lab{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--faint);min-width:64px}
#px .rail{display:flex;gap:5px;flex-wrap:wrap}
#px .qi{background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:18px;padding:5px 9px;min-width:200px}
#px .qi:focus{outline:none;border-color:var(--edge)}

#px .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:12px;align-items:start;margin-top:16px}
#px .lane{padding:0}
#px .lane.off{display:none}
#px .lh{padding:9px 11px;border-bottom:3px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--deep)}
#px .lh .dot{width:10px;height:10px;flex:0 0 10px}
#px .lh h2{font-family:'Press Start 2P',monospace;font-size:9px}
#px .lh .ct{margin-left:auto;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--faint)}
#px .lane[data-k="live"] .dot{background:var(--live)} #px .lane[data-k="live"] h2{color:var(--live)}
#px .lane[data-k="hold"] .dot{background:var(--hold)} #px .lane[data-k="hold"] h2{color:var(--hold)}
#px .lane[data-k="cold"] .dot{background:var(--cold)} #px .lane[data-k="cold"] h2{color:var(--cold)}
#px .lane[data-k="done"] .dot{background:var(--done)} #px .lane[data-k="done"] h2{color:var(--done)}
#px .lb2{padding:9px}
#px .morebar{margin-top:8px}
#px .morebar .btn{width:100%;padding:7px 6px;color:var(--faint)}
#px .morebar .btn:hover{color:var(--text)}

#px .card{background:var(--lift);border:3px solid var(--line);padding:9px 10px;margin-bottom:8px;cursor:pointer;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.05), inset -2px -2px 0 rgba(0,0,0,.4)}
#px .card:last-child{margin-bottom:0}
#px .card.now{border-color:var(--live)}
#px .card .nm{font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.5;margin-bottom:5px}
#px .card .st{font-size:18px;color:var(--dim);line-height:1.25}
#px .card .mt{font-size:16px;color:var(--faint);margin-top:5px}
#px .tgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
#px .tg{font-family:'Press Start 2P',monospace;font-size:6px;padding:3px 4px;background:var(--panel);border:2px solid var(--line);color:var(--faint)}
#px .bw{height:12px;background:var(--void);border:2px solid var(--line);margin-top:7px;padding:1px}
#px .bw i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 6px)}
#px .lane[data-k="live"] .bw i{color:var(--live)} #px .lane[data-k="hold"] .bw i{color:var(--hold)}
#px .lane[data-k="cold"] .bw i{color:var(--cold)} #px .lane[data-k="done"] .bw i{color:var(--done)}

#px .exp{display:none;margin-top:9px;padding-top:9px;border-top:2px dashed var(--edge)}
#px .card.open .exp{display:block}
#px .exp .ttl{margin:0 0 6px}
#px .swap{width:100%;margin-top:9px;color:var(--cold)}
#px .swap:hover{color:#fff;background:var(--edge)}
#px .swap[disabled]{color:var(--live);opacity:1}
#px .swap[disabled]:hover{background:var(--lift);color:var(--live)}

/* add */
#px .add{margin-top:16px;padding:12px}
#px .add h3{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--hold);margin-bottom:9px}
#px .add .row{display:flex;gap:7px;flex-wrap:wrap}
#px .add input{flex:1;min-width:150px;background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:18px;padding:6px 8px}
#px .add input:focus{outline:none;border-color:var(--edge)}

/* ---------- barra de datos ---------- */
#px .databar{margin-top:22px;padding:12px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#px .databar .dbi b{display:block;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);margin-bottom:6px}
#px .databar .dbi span{font-size:17px;color:var(--faint)}
#px .databar .dbi span.ok{color:var(--live)}
#px .databar .dbi span.bad{color:var(--hot)}
#px .databar .dbb{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
#px .ft{text-align:center;color:var(--faint);font-size:17px;margin-top:20px}
@media(max-width:620px){
  #px .hd h1{font-size:15px}
  #px .hh .hn{font-size:12px}
  #px .hh .hr{margin-left:0;text-align:left}
  #px .databar .dbb{margin-left:0}
}
</style>

</head>
<body>
<div id="px">
  <div class="hd">
    <div class="wrap">
      <div class="tag">Bitacora Gamer // Fohsen</div>
      <h1>GAMING PROTOCOL V.1 <i>|</i> FOHSEN</h1>
      <div class="xp">
        <div class="lb"><span>Progreso total</span><span id="xpn">0%</span></div>
        <div class="xpbar"><i id="xpf"></i></div>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="warn" id="warn" hidden>
      <b>&#9888; El guardado automatico no funciona</b>
      <span id="warnt"></span>
    </div>

    <!-- ============ DASHBOARD ============ -->
    <div class="dash" id="dash">
      <div class="sect" id="hsect">Experiencia actual</div>
      <section class="fr hero" id="hero"></section>

      <div class="sect">Mundos recientes</div>
      <div class="worlds" id="worlds"></div>
    </div>

    <!-- ============ BACKLOG ============ -->
    <div class="sect">Backlog <b id="qn"></b></div>

    <div class="frow">
      <span class="lab">Buscar</span>
      <input class="qi" id="q" placeholder="nombre del juego..." maxlength="48">
    </div>
    <div class="frow">
      <span class="lab">Estado</span>
      <div class="rail" id="rs"></div>
    </div>
    <div class="frow">
      <span class="lab">Etiqueta</span>
      <div class="rail" id="rt"></div>
    </div>

    <div class="lanes" id="lanes"></div>

    <div class="fr add">
      <h3>+ Agregar juego</h3>
      <div class="row">
        <input id="ni" placeholder="Nombre del juego" maxlength="48">
        <input id="ti" placeholder="etiquetas: rpg, gfn, coop" maxlength="60">
        <button class="btn" id="addb">Agregar</button>
      </div>
    </div>

    <!-- ============ DATOS ============ -->
    <section class="fr databar">
      <div class="dbi">
        <b>Tus datos</b>
        <span id="dbs">Cargando...</span>
      </div>
      <div class="dbb">
        <button class="btn" id="expb">&#8681; Exportar respaldo</button>
        <button class="btn" id="impb">&#8679; Importar respaldo</button>
        <button class="btn" id="rstb" disabled>&#8634; Restaurar copia</button>
        <input type="file" id="imp" accept=".json,application/json" hidden>
      </div>
    </section>

    <div class="ft">El backlog es para encontrar &middot; el panel de arriba es para jugar y anotar</div>
  </div>
</div>

/* ---------------- estado ---------------- */
let items=SEED.map(o=>({...o}));
let active=null;   // el juego que estas jugando ahora
let focus=null;    // el que muestra el hero (por defecto, el activo)
let fS='all', fT='all', fQ='';
let more={};
let canStore=true, lastSaved=0;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=id=>items.find(i=>i.id===id);
const laneName=k=>(LANES.find(L=>L.k===k)||{t:'?'}).t;

function safeUrl(u){
  u=String(u==null?'':u).trim(); if(!u)return '';
  if(!/^https?:\/\//i.test(u)) u='https://'+u.replace(/^\/+/,'');
  try{const p=new URL(u);return (p.protocol==='http:'||p.protocol==='https:')?p.href:''}catch(e){return ''}
}
function ago(ts){
  if(!ts)return 'sin registro';
  const d=Math.floor((Date.now()-ts)/D);
  if(d<=0)return 'hoy'; if(d===1)return 'ayer';
  if(d<7)return 'hace '+d+' dias';
  if(d<30)return 'hace '+Math.floor(d/7)+' sem';
  if(d<365)return 'hace '+Math.floor(d/30)+' meses';
  return 'hace mas de un ano';
}
function stamp(){
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes());
}

/* =========================================================
   GUARDADO Y RESPALDO
   - Se guarda en el navegador (localStorage).
   - Antes de cada escritura, la version anterior pasa a una
     copia de seguridad, para poder deshacer un desastre.
   - Si el navegador bloquea el guardado, se avisa en pantalla.
   ========================================================= */
function storageOk(){
  try{localStorage.setItem('__probe','1');localStorage.removeItem('__probe');return true}
  catch(e){return false}
}
function payload(){return {v:3,items,active,saved:Date.now()}}

/* Un respaldo solo sirve si se puede leer. Si lo guardado esta corrupto, NO lo
   dejamos pisar la copia buena: seria destruir el unico salvavidas que queda. */
function esRespaldoLegible(txt){
  try{return !!migrate(JSON.parse(txt))}catch(e){return false}
}

function put(){
  if(!canStore){status();return}
  try{
    const antes=localStorage.getItem(KEY);
    if(antes && esRespaldoLegible(antes)) localStorage.setItem(PREV,antes);   // copia rodante
    localStorage.setItem(KEY,JSON.stringify(payload()));
    lastSaved=Date.now();
  }catch(e){
    canStore=false;
    showWarn('El navegador rechazo el guardado (puede estar lleno o en modo incognito). Exporta un respaldo antes de cerrar la pagina.');
  }
  status();
}
let st=null;
function save(){clearTimeout(st);st=setTimeout(put,300)}

function showWarn(msg){
  const w=$('#warn'); $('#warnt').textContent=msg; w.hidden=false;
}
function status(){
  const el=$('#dbs');
  if(!canStore){el.className='bad';el.textContent='Sin guardado automatico - exporta un respaldo';return}
  const n=items.length;
  el.className='ok';
  el.textContent=n+' titulos guardados en este navegador'+(lastSaved?' · ultimo guardado '+new Date(lastSaved).toLocaleTimeString():'');
  try{$('#rstb').disabled=!localStorage.getItem(PREV)}catch(e){}
}

/* Acepta los tres formatos que ha tenido el archivo:
   v1 = array pelado · v2 = {v:2,items,active} · v3 = igual + ficha.
   Los campos que falten se rellenan desde SEED, asi nada editado se pierde. */
function migrate(raw){
  let list=null, act=null;
  if(Array.isArray(raw)) list=raw;
  else if(raw && typeof raw==='object' && Array.isArray(raw.items)){list=raw.items; act=raw.active||null}
  if(!list || !list.length) return null;
  const base={}; SEED.forEach(s=>{base[s.id]=s});
  const num=(v,d)=>typeof v==='number'&&isFinite(v)?v:d;
  const clean=list.map(it=>{
    if(!it || !it.id) return null;
    const b=base[it.id]||{};
    const pick=(k,d)=>it[k]!=null?it[k]:(b[k]!=null?b[k]:d);
    return {
      id:String(it.id),
      l:LANES.some(L=>L.k===it.l)?it.l:(b.l||'cold'),
      p:Math.max(0,Math.min(100,num(it.p,num(b.p,0)))),
      n:pick('n','Sin nombre'),
      tags:Array.isArray(it.tags)?it.tags.filter(t=>typeof t==='string'):(b.tags||[]).slice(),
      s:pick('s',''), x:pick('x',''), lore:pick('lore',''),
      dev:pick('dev',''), year:String(pick('year','')), plat:pick('plat',''), saga:pick('saga',''),
      hours:Math.max(0,num(it.hours,num(b.hours,0))),
      score:Math.max(0,Math.min(10,num(it.score,num(b.score,0)))),
      stats:(Array.isArray(it.stats)?it.stats:(b.stats||[])).filter(o=>o&&o.k!=null).map(o=>({k:String(o.k),v:String(o.v==null?'':o.v)})),
      links:(Array.isArray(it.links)?it.links:(b.links||[])).filter(o=>o&&safeUrl(o.u)).map(o=>({t:String(o.t||'Link'),u:safeUrl(o.u)})),
      last:num(it.last,num(b.last,0))
    };
  }).filter(Boolean);
  return clean.length?{items:clean,active:act}:null;
}

function pull(){
  canStore=storageOk();
  if(!canStore){
    showWarn('Tu navegador no permite guardar datos en esta pagina (suele pasar en modo incognito o con las cookies bloqueadas). Puedes usar la pagina, pero los cambios se pierden al cerrarla.');
    return;
  }
  try{
    const v=localStorage.getItem(KEY); if(!v)return;
    const d=migrate(JSON.parse(v));
    if(d){items=d.items; active=d.active; lastSaved=(JSON.parse(v).saved)||0}
  }catch(e){
    showWarn('Los datos guardados estaban danados y no se pudieron leer. Se cargo el catalogo por defecto. Si tienes un respaldo exportado, importalo ahora; si no, revisa "Restaurar copia".');
  }
}
function pickActive(){
  if(active && byId(active))return;
  const live=items.filter(i=>i.l==='live').sort((a,b)=>(b.last||0)-(a.last||0));
  const any=items.slice().sort((a,b)=>(b.last||0)-(a.last||0));
  active=(live[0]||any[0]||{}).id||null;
}

/* ---------------- exportar / importar ---------------- */
function exportData(){
  try{
    const txt=JSON.stringify(payload(),null,2);
    const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url; a.download='gaming-protocol_'+stamp()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){alert('No se pudo generar el archivo de respaldo.')}
}
function applyImport(raw,origen){
  const d=migrate(raw);
  if(!d){alert('Ese archivo no tiene el formato de un respaldo de Gaming Protocol.');return false}
  const ok=confirm('Vas a reemplazar los '+items.length+' titulos actuales por los '+d.items.length+' de '+origen+'.\n\nLo que tienes ahora quedara en "Restaurar copia" por si te arrepientes.\n\n Continuar?');
  if(!ok)return false;
  put();                       // deja lo actual en la copia de seguridad
  items=d.items; active=d.active;
  buildRails(); render(); put();
  return true;
}
function restorePrev(){
  try{
    const v=localStorage.getItem(PREV);
    if(!v){alert('No hay ninguna copia de seguridad todavia.');return}
    applyImport(JSON.parse(v),'la copia de seguridad');
  }catch(e){alert('La copia de seguridad no se pudo leer.')}
}

/* ---------------- BACKLOG ---------------- */
function tagList(){return [...new Set(items.flatMap(i=>i.tags))].sort()}

function buildRails(){
  $('#rs').innerHTML=`<button class="btn" data-s="all" aria-pressed="${fS==='all'}">Todos</button>`+
    LANES.map(L=>`<button class="btn" data-s="${L.k}" aria-pressed="${fS===L.k}">${L.t}</button>`).join('');
  $('#rt').innerHTML=`<button class="btn" data-t="all" aria-pressed="${fT==='all'}">Todas</button>`+
    tagList().map(t=>`<button class="btn" data-t="${esc(t)}" aria-pressed="${fT===t}">${esc(t)}</button>`).join('');
}
function matches(i){
  if(fT!=='all' && !i.tags.includes(fT)) return false;
  if(fQ && i.n.toLowerCase().indexOf(fQ)===-1) return false;
  return true;
}
function meta(i){
  const bits=[];
  if(i.year)bits.push(i.year);
  if(i.dev)bits.push(i.dev);
  if(i.score)bits.push(i.score+'/10');
  return bits.join(' · ');
}

function renderLanes(){
  const opened=[...document.querySelectorAll('.card.open')].map(c=>c.dataset.id);
  const searching=!!fQ;
  $('#lanes').innerHTML=LANES.map(L=>{
    const full=items.filter(i=>i.l===L.k && matches(i));
    const list=(more[L.k]||searching)?full:full.slice(0,CAP);
    const hid=full.length-list.length;
    return `<section class="lane fr ${fS!=='all'&&fS!==L.k?'off':''}" data-k="${L.k}">
      <div class="lh"><span class="dot"></span><h2>${L.t}</h2><span class="ct">${hid?list.length+'/'+full.length:full.length}</span></div>
      <div class="lb2">${full.length?list.map(i=>`
        <article class="card ${opened.includes(i.id)?'open':''}${i.id===active?' now':''}" data-id="${esc(i.id)}">
          <div class="nm">${esc(i.n)}</div>
          <div class="st">${esc(i.s)}</div>
          ${meta(i)?`<div class="mt">${esc(meta(i))}</div>`:''}
          <div class="tgs">${i.tags.map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div>
          <div class="bw"><i style="width:${i.p}%"></i></div>
          <div class="exp">
            <div class="ttl">Mover a</div>
            <div class="mv">${LANES.filter(x=>x.k!==i.l).map(x=>
              `<button class="btn" data-m="${esc(i.id)}" data-l="${x.k}">${x.t}</button>`).join('')}
              <button class="btn" data-del="${esc(i.id)}">Borrar</button></div>
            ${i.id===active
              ? '<button class="btn swap" disabled>&#9632; Universo actual</button>'
              : `<button class="btn swap" data-swap="${esc(i.id)}">&iquest;Cambiar de universo?</button>`}
          </div>
        </article>`).join('')+(full.length>CAP&&!searching?`<div class="morebar"><button class="btn" data-more="${L.k}">${more[L.k]?'- Ver menos':'+ Ver '+hid+' mas'}</button></div>`:''):'<div class="none" style="padding:6px 2px">Vacio</div>'}
      </div></section>`;
  }).join('');
  $('#qn').textContent = fQ ? items.filter(matches).length+' de '+items.length+' coinciden' : items.length+' titulos';
}

function renderXp(){
  const tot=items.length?Math.round(items.reduce((a,b)=>a+b.p,0)/items.length):0;
  $('#xpf').style.width=tot+'%'; $('#xpn').textContent=tot+'%';
}
function render(){
  pickActive();
  if(!focus||!byId(focus))focus=active;
  renderHero();renderWorlds();renderLanes();renderXp();status();
}

/* ---------------- eventos: dashboard ---------------- */
$('#dash').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('a'))return;

  if(t.closest('[data-back]')){focus=active;render();return}

  const sa=t.closest('[data-setactive]');
  if(sa){const it=byId(sa.dataset.setactive);it.last=Date.now();active=it.id;render();save();return}

  const sc=t.closest('[data-score]');
  if(sc){const it=byId(sc.dataset.score);const v=+sc.dataset.v;
    it.score=(it.score===v)?0:v;render();save();return}

  const sp=t.closest('[data-sp]');
  if(sp){const it=byId(sp.dataset.sp);
    it.p=Math.max(0,Math.min(100,it.p+ +sp.dataset.d));render();save();return}

  const sm=t.closest('[data-sm]');
  if(sm){byId(sm.dataset.sm).l=sm.dataset.l;render();save();return}

  const as=t.closest('[data-addstat]');
  if(as){const it=byId(as.dataset.addstat);
    const k=$('#skk').value.trim(), v=$('#svv').value.trim();
    if(!k&&!v)return;
    it.stats.push({k:(k||'DATO').toUpperCase(),v:v||'-'});renderHero();save();return}

  const rs=t.closest('[data-rmstat]');
  if(rs){byId(rs.dataset.rmstat).stats.splice(+rs.dataset.ix,1);renderHero();save();return}

  const al=t.closest('[data-addlink]');
  if(al){const it=byId(al.dataset.addlink);
    const tt=$('#lkt').value.trim(), uu=safeUrl($('#lku').value);
    if(!uu){alert('Ese enlace no es valido. Debe ser una direccion web (http o https).');return}
    it.links.push({t:tt||'Link',u:uu});renderHero();save();return}

  const rl=t.closest('[data-rmlink]');
  if(rl){byId(rl.dataset.rmlink).links.splice(+rl.dataset.ix,1);renderHero();save();return}

  const fo=t.closest('[data-focus]');
  if(fo){focus=fo.dataset.focus;render();
    $('#hero').scrollIntoView({behavior:'smooth',block:'nearest'});return}
});

$('#dash').addEventListener('input',e=>{
  const el=e.target, d=el.dataset;
  if(d.lore){byId(d.lore).lore=el.value;save();return}
  if(d.sx){byId(d.sx).x=el.value;save();return}
  if(d.f){
    const it=byId(d.id); if(!it)return;
    it[d.f] = d.f==='hours' ? Math.max(0,parseInt(el.value.replace(/\D/g,''),10)||0) : el.value;
    save();return;
  }
});

/* ---------------- eventos: backlog ---------------- */
$('#lanes').addEventListener('click',e=>{
  const t=e.target;
  const mb=t.closest('[data-m]');
  if(mb){byId(mb.dataset.m).l=mb.dataset.l;render();save();return}
  const db=t.closest('[data-del]');
  if(db){const id=db.dataset.del, it=byId(id);
    if(!confirm('Borrar "'+it.n+'" del backlog? Esto no se puede deshacer desde la pagina.'))return;
    items=items.filter(i=>i.id!==id);
    if(active===id)active=null; if(focus===id)focus=null;
    buildRails();render();save();return}
  const mo=t.closest('[data-more]');
  if(mo){more[mo.dataset.more]=!more[mo.dataset.more];renderLanes();return}
  const sw=t.closest('[data-swap]');
  if(sw){
    const it=byId(sw.dataset.swap);
    it.last=Date.now(); active=it.id; focus=it.id;
    render();save();
    $('#dash').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  const c=t.closest('.card'); if(c)c.classList.toggle('open');
});

$('#rs').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;fS=b.dataset.s;buildRails();renderLanes()});
$('#rt').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;fT=b.dataset.t;buildRails();renderLanes()});
$('#q').addEventListener('input',e=>{fQ=e.target.value.trim().toLowerCase();renderLanes()});

$('#addb').addEventListener('click',()=>{
  const n=$('#ni').value.trim(); if(!n)return;
  const tg=$('#ti').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  items.unshift({id:'g'+Date.now(),l:'cold',p:0,n,tags:tg.length?tg:['nuevo'],
    s:'Recien agregado',x:'Sin notas todavia.',lore:'',
    dev:'',year:'',plat:'',saga:'',hours:0,score:0,stats:[],links:[],last:0});
  $('#ni').value='';$('#ti').value='';
  buildRails();render();save();
});

/* ---------------- eventos: datos ---------------- */
$('#expb').addEventListener('click',exportData);
$('#rstb').addEventListener('click',restorePrev);
$('#impb').addEventListener('click',()=>$('#imp').click());
$('#imp').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{applyImport(JSON.parse(r.result),'"'+f.name+'"')}
               catch(err){alert('Ese archivo no es un JSON valido.')}};
  r.onerror=()=>alert('No se pudo leer el archivo.');
  r.readAsText(f);
});

/* ---------------- arranque ---------------- */
pull();
buildRails();
render();
/* Primera visita: dejar el catalogo guardado de inmediato, para que la barra de
   datos diga la verdad y no exista una ventana en la que nada esta persistido. */
try{ if(canStore && !localStorage.getItem(KEY)) put(); }catch(e){}
})();
</script>
