<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming Protocol V.1 | Fohsen</title>
<meta name="theme-color" content="#0d0a14">
<style>html,body{margin:0;padding:0;background:#0d0a14}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
#px{
  --void:#0d0a14; --deep:#161226; --panel:#1e1932; --lift:#2a2444;
  --line:#0a0812; --edge:#4b4173;
  --text:#efe9ff; --dim:#9a8fc4; --faint:#6b6194;
  --live:#7cf29a; --hold:#ffd166; --cold:#6fc3ff; --done:#7a7196; --hot:#ff6b7a;
  background:var(--void); color:var(--text);
  font-family:'VT323',monospace; font-size:19px; line-height:1.35;
  padding:0 0 60px; min-height:100vh;
  image-rendering:pixelated;
  background-image:
    linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
  background-size:4px 4px;
}
#px *{box-sizing:border-box;margin:0;padding:0}
#px .p8{font-family:'Press Start 2P',monospace;letter-spacing:0}
#px .wrap{max-width:1160px;margin:0 auto;padding:0 16px}
#px button{font:inherit;cursor:pointer;color:inherit;background:none;border:none}

/* pixel frame */
#px .fr{
  background:var(--panel); border:3px solid var(--line);
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.05), inset -3px -3px 0 rgba(0,0,0,.45);
}
#px .btn{
  background:var(--lift); border:3px solid var(--line); padding:6px 10px;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.09), inset -2px -2px 0 rgba(0,0,0,.5);
  font-family:'Press Start 2P',monospace; font-size:8px; color:var(--dim);
  text-transform:uppercase; transition:none;
}
#px .btn:hover{color:var(--text);background:#332c52}
#px .btn:active,#px .btn[aria-pressed="true"]{
  box-shadow: inset -2px -2px 0 rgba(255,255,255,.06), inset 2px 2px 0 rgba(0,0,0,.5);
  background:var(--edge); color:#fff;
}

/* header */
#px .hd{border-bottom:3px solid var(--line);background:var(--deep);padding:22px 0 16px;margin-bottom:18px}
#px .hd h1{font-family:'Press Start 2P',monospace;font-size:23px;line-height:1.45;color:var(--hold);
  text-shadow:3px 3px 0 #7a4a00, 6px 6px 0 rgba(0,0,0,.5);margin-bottom:10px}
#px .hd h1 i{font-style:normal;color:var(--edge);text-shadow:3px 3px 0 rgba(0,0,0,.5)}
#px .hd .tag{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--faint);margin-bottom:10px}
#px .xp{margin-top:14px}
#px .xp .lb{display:flex;justify-content:space-between;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);margin-bottom:5px}
#px .xpbar{height:16px;background:var(--void);border:3px solid var(--line);padding:2px}
#px .xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--hold) 0 6px,#e0b44a 6px 8px);width:0;transition:width .3s steps(12)}

/* rotulo de seccion */
#px .sect{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--faint);
  display:flex;align-items:center;gap:9px;margin:0 0 9px}
#px .sect:after{content:'';flex:1;height:3px;background:var(--line)}
#px .sect b{color:var(--dim);font-weight:normal}

/* ---------- DASHBOARD ---------- */
#px .dash{margin-bottom:26px}
#px .dgrid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:760px){#px .dgrid{grid-template-columns:1fr}}

/* experiencia actual */
#px .cur{padding:12px;cursor:pointer;text-align:left;width:100%;display:block}
#px .cur.on{border-color:var(--edge)}
#px .cur .knm{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.65;color:var(--live);margin-bottom:7px}
#px .cur .ksub{font-size:18px;color:var(--dim);margin-bottom:8px}
#px .cur .kpct{font-family:'Press Start 2P',monospace;font-size:22px;color:var(--hold);margin:10px 0 7px}
#px .cur .khint{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--faint);margin-top:9px}
#px .cur .none{color:var(--faint);font-size:17px;padding:10px 0}

/* mundos recientes */
#px .worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
#px .world{padding:9px;cursor:pointer;text-align:left;display:block;width:100%}
#px .world.on{border-color:var(--edge)}
#px .world .wn{font-family:'Press Start 2P',monospace;font-size:7px;line-height:1.75;margin-bottom:6px}
#px .world .wm{font-size:16px;color:var(--faint)}
#px .world .wb{height:9px;background:var(--void);border:2px solid var(--line);margin-top:7px;padding:1px}
#px .world .wb i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--cold) 0 4px,transparent 4px 6px)}
#px .worlds .none{color:var(--faint);font-size:17px;grid-column:1/-1}

/* pantalla profunda */
#px .screen{display:none;margin-top:12px;padding:13px}
#px .screen.open{display:block}
#px .sch{display:flex;align-items:flex-start;gap:10px;border-bottom:3px solid var(--line);padding-bottom:11px;margin-bottom:13px}
#px .sch .n1{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.6;color:var(--hold)}
#px .sch .n2{font-size:18px;color:var(--dim);margin-top:6px}
#px .sch .nx{margin-left:auto;flex:0 0 auto}
#px .scg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
#px .ttl{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--faint);margin:0 0 7px}
#px .blk{margin-bottom:15px}
#px .blk:last-child{margin-bottom:0}
#px .bigbar{height:22px;background:var(--void);border:3px solid var(--line);padding:2px;margin-bottom:8px}
#px .bigbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--hold) 0 6px,#e0b44a 6px 8px)}
#px .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
#px .stat{background:var(--void);border:2px solid var(--line);padding:7px 8px;position:relative}
#px .stat b{display:block;font-family:'Press Start 2P',monospace;font-size:6px;color:var(--faint);font-weight:normal;margin-bottom:6px;line-height:1.5}
#px .stat span{font-size:18px;color:var(--text);word-break:break-word}
#px .stat .rm{position:absolute;top:1px;right:3px;font-size:16px;color:var(--faint);line-height:1}
#px .stat .rm:hover{color:var(--hot)}
#px .lks{display:flex;gap:6px;flex-wrap:wrap}
#px .lk{display:inline-flex;align-items:center;gap:7px;background:var(--lift);border:3px solid var(--line);padding:6px 8px;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.09), inset -2px -2px 0 rgba(0,0,0,.5)}
#px .lk a{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--cold);text-decoration:none}
#px .lk a:hover{color:#fff;text-decoration:underline}
#px .lk .rm{font-size:16px;color:var(--faint);line-height:1}
#px .lk .rm:hover{color:var(--hot)}
#px .lks .none{color:var(--faint);font-size:17px}
#px .mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
#px .mini input{flex:1;min-width:88px;background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:17px;padding:5px 7px}
#px .mini input:focus{outline:none;border-color:var(--edge)}
#px .screen textarea{width:100%;min-height:76px;background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:18px;line-height:1.35;padding:7px 8px;resize:vertical}
#px .screen textarea:focus{outline:none;border-color:var(--edge)}
#px .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#px .ctl .pc{font-family:'Press Start 2P',monospace;font-size:9px;min-width:44px;text-align:center;color:var(--hold)}
#px .mv{display:flex;gap:4px;flex-wrap:wrap}

/* ---------- BACKLOG ---------- */
/* filters */
#px .frow{margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#px .frow>.lab{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--faint);min-width:64px}
#px .rail{display:flex;gap:5px;flex-wrap:wrap}
#px .qi{background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:18px;padding:5px 9px;min-width:200px}
#px .qi:focus{outline:none;border-color:var(--edge)}
#px .qn{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--faint)}

/* lanes */
#px .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:12px;align-items:start;margin-top:16px}
#px .lane{padding:0}
#px .lane.off{display:none}
#px .lh{padding:9px 11px;border-bottom:3px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--deep)}
#px .lh .dot{width:10px;height:10px;flex:0 0 10px}
#px .lh h2{font-family:'Press Start 2P',monospace;font-size:9px}
#px .lh .ct{margin-left:auto;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--faint)}
#px .lane[data-k="live"] .dot{background:var(--live)} #px .lane[data-k="live"] h2{color:var(--live)}
#px .lane[data-k="hold"] .dot{background:var(--hold)} #px .lane[data-k="hold"] h2{color:var(--hold)}
#px .lane[data-k="cold"] .dot{background:var(--cold)} #px .lane[data-k="cold"] h2{color:var(--cold)}
#px .lane[data-k="done"] .dot{background:var(--done)} #px .lane[data-k="done"] h2{color:var(--done)}
#px .lb2{padding:9px}
#px .morebar{margin-top:8px}
#px .morebar .btn{width:100%;padding:7px 6px;color:var(--faint)}
#px .morebar .btn:hover{color:var(--text)}

/* card */
#px .card{background:var(--lift);border:3px solid var(--line);padding:9px 10px;margin-bottom:8px;cursor:pointer;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.05), inset -2px -2px 0 rgba(0,0,0,.4)}
#px .card:last-child{margin-bottom:0}
#px .card.hide{display:none}
#px .card.now{border-color:var(--live)}
#px .card .nm{font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.5;margin-bottom:5px}
#px .card .st{font-size:18px;color:var(--dim);line-height:1.25}
#px .tgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
#px .tg{font-family:'Press Start 2P',monospace;font-size:6px;padding:3px 4px;background:var(--panel);border:2px solid var(--line);color:var(--faint)}
#px .bw{height:12px;background:var(--void);border:2px solid var(--line);margin-top:7px;padding:1px}
#px .bw i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 6px)}
#px .lane[data-k="live"] .bw i{color:var(--live)} #px .lane[data-k="hold"] .bw i{color:var(--hold)}
#px .lane[data-k="cold"] .bw i{color:var(--cold)} #px .lane[data-k="done"] .bw i{color:var(--done)}

/* expanded */
#px .exp{display:none;margin-top:9px;padding-top:9px;border-top:2px dashed var(--edge)}
#px .card.open .exp{display:block}
#px .exp .ttl{margin:8px 0 5px}
#px .exp textarea{width:100%;min-height:64px;background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:18px;line-height:1.3;padding:6px 7px;resize:vertical}
#px .exp textarea:focus{outline:none;border-color:var(--edge)}
#px .swap{width:100%;margin-top:9px;color:var(--cold)}
#px .swap:hover{color:#fff;background:var(--edge)}
#px .swap[disabled]{color:var(--live);cursor:default}
#px .swap[disabled]:hover{background:var(--lift)}

/* add */
#px .add{margin-top:16px;padding:12px}
#px .add h3{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--hold);margin-bottom:9px}
#px .add .row{display:flex;gap:7px;flex-wrap:wrap}
#px .add input{flex:1;min-width:150px;background:var(--void);border:2px solid var(--line);color:var(--text);
  font-family:'VT323',monospace;font-size:18px;padding:6px 8px}
#px .add input:focus{outline:none;border-color:var(--edge)}
#px .save{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--faint);height:12px;margin-top:10px;text-align:right}
#px .ft{text-align:center;color:var(--faint);font-size:17px;margin-top:22px}
@media(max-width:620px){#px .hd h1{font-size:15px}#px .sch .n1{font-size:11px}}
</style>

</head>

      <h1>GAMING PROTOCOL V.1 <i>|</i> FOHSEN</h1>

        <div class="lb"><span>Progreso total</span><span id="xpn">0%</span></div>

      </div>
    </div>
  </div>

  <div class="wrap">

    <!-- ============ DASHBOARD ============ -->

    <div class="frow">

    <div class="frow">

    <div class="lanes" id="lanes"></div>

    <div class="fr add">

        <input id="ni" placeholder="Nombre del juego" maxlength="48">
        <input id="ti" placeholder="etiquetas: rpg, gfn, coop" maxlength="60">

      </div>
    </div>

    <div class="save" id="mk"></div>
    <div class="ft">Clic en una tarjeta para abrirla &middot; usa &quot;Cambiar de universo&quot; para llevarla al panel</div>
  </div>
</div>

/* ---------------- estado ---------------- */
let items=SEED.map(o=>({...o}));
let active=null;      // id de la Experiencia actual
let focus=null;       // id que muestra la pantalla profunda
let open=false;       // pantalla profunda abierta
let fS='all', fT='all', fQ='';
let more={};

const $=s=>document.querySelector(s);
const mk=$('#mk'); let ft=null, st=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=id=>items.find(i=>i.id===id);
const laneName=k=>(LANES.find(L=>L.k===k)||{t:'?'}).t;

function safeUrl(u){
  u=String(u==null?'':u).trim(); if(!u)return '';
  if(!/^https?:\/\//i.test(u)) u='https://'+u.replace(/^\/+/,'');
  try{const p=new URL(u);return (p.protocol==='http:'||p.protocol==='https:')?p.href:''}catch(e){return ''}
}
function ago(ts){
  if(!ts)return 'sin registro';
  const d=Math.floor((Date.now()-ts)/D);
  if(d<=0)return 'hoy'; if(d===1)return 'ayer';
  if(d<7)return 'hace '+d+' dias';
  if(d<30)return 'hace '+Math.floor(d/7)+' sem';
  if(d<365)return 'hace '+Math.floor(d/30)+' meses';
  return 'hace mas de un ano';
}
function flash(m){mk.textContent=m;clearTimeout(ft);ft=setTimeout(()=>mk.textContent='',1500)}

/* ---- Guardado local del navegador ---- */
async function put(){
  try{localStorage.setItem(KEY,JSON.stringify({v:2,items,active}));flash('Guardado');}
  catch(e){flash('Error al guardar')}
}
function save(){clearTimeout(st);st=setTimeout(put,300)}

/* Migracion: acepta el formato viejo (un array pelado) y el nuevo (objeto con
   items + active). Los campos nuevos que falten se rellenan desde SEED, para que
   nada de lo que Juan haya editado antes se pierda. */
function migrate(raw){
  let list=null, act=null;
  if(Array.isArray(raw)) list=raw;
  else if(raw && typeof raw==='object' && Array.isArray(raw.items)){list=raw.items; act=raw.active||null}
  if(!list || !list.length) return null;
  const base={}; SEED.forEach(s=>{base[s.id]=s});
  const clean=list.map(it=>{
    if(!it || !it.id) return null;
    const b=base[it.id]||{};
    return {
      id:String(it.id),
      l:LANES.some(L=>L.k===it.l)?it.l:(b.l||'cold'),
      p:typeof it.p==='number'?Math.max(0,Math.min(100,it.p)):(b.p||0),
      n:it.n||b.n||'Sin nombre',
      tags:Array.isArray(it.tags)?it.tags:(b.tags||[]).slice(),
      s:it.s!=null?it.s:(b.s||''),
      x:it.x!=null?it.x:(b.x||''),
      lore:it.lore!=null?it.lore:(b.lore||''),
      stats:Array.isArray(it.stats)?it.stats:(b.stats||[]).map(o=>({...o})),
      links:Array.isArray(it.links)?it.links:(b.links||[]).map(o=>({...o})),
      last:typeof it.last==='number'?it.last:(b.last||0)
    };
  }).filter(Boolean);
  return clean.length?{items:clean,active:act}:null;
}
async function pull(){
  try{
    const v=localStorage.getItem(KEY); if(!v)return;
    const d=migrate(JSON.parse(v));
    if(d){items=d.items; active=d.active}
  }catch(e){}
}
function pickActive(){
  if(active && byId(active))return;
  const live=items.filter(i=>i.l==='live').sort((a,b)=>(b.last||0)-(a.last||0));
  const any=items.slice().sort((a,b)=>(b.last||0)-(a.last||0));
  active=(live[0]||any[0]||{}).id||null;
}

/* ---------------- dashboard ---------------- */
function recents(){
  return items.filter(i=>i.id!==active&&i.last)
              .sort((a,b)=>b.last-a.last).slice(0,RECENT);
}

function renderCur(){
  const it=byId(active);
  const el=$('#cur');
  el.className='fr cur'+(open&&focus===active?' on':'');
  if(!it){
    el.innerHTML='<div class="none">Ningun universo cargado. Busca un juego en el backlog y pulsa "Cambiar de universo".</div>';
    return;
  }
  el.dataset.focus=it.id;
  el.innerHTML=
    `<div class="knm">${esc(it.n)}</div>
     <div class="ksub">${esc(it.s)}</div>
     <div class="tgs">${it.tags.map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div>
     <div class="kpct">${it.p}%</div>
     <div class="bigbar"><i style="width:${it.p}%"></i></div>
     <div class="khint">${esc(laneName(it.l))} &middot; ${esc(ago(it.last))} &middot; clic para abrir</div>`;
}

  const list=recents();

}

         </div>

           <input id="skk" placeholder="dato (ej: NIVEL)" maxlength="18">
           <input id="svv" placeholder="valor (ej: 78)" maxlength="24">

           ${it.links.length?it.links.map((L,ix)=>{
             const u=safeUrl(L.u); if(!u)return '';
             return `<span class="lk"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(L.t||'link')}</a>
                     <button class="rm" data-rmlink="${esc(it.id)}" data-ix="${ix}" title="Quitar">&times;</button></span>`;

function renderDash(){renderCur();renderWorlds();renderScreen()}

/* ---------------- backlog ---------------- */
function tagList(){return [...new Set(items.flatMap(i=>i.tags))].sort()}

function buildRails(){
  $('#rs').innerHTML=`<button class="btn" data-s="all" aria-pressed="${fS==='all'}">Todos</button>`+
    LANES.map(L=>`<button class="btn" data-s="${L.k}" aria-pressed="${fS===L.k}">${L.t}</button>`).join('');
  $('#rt').innerHTML=`<button class="btn" data-t="all" aria-pressed="${fT==='all'}">Todas</button>`+
    tagList().map(t=>`<button class="btn" data-t="${esc(t)}" aria-pressed="${fT===t}">${esc(t)}</button>`).join('');
}

function matches(i){
  if(fT!=='all' && !i.tags.includes(fT)) return false;
  if(fQ && i.n.toLowerCase().indexOf(fQ)===-1) return false;
  return true;
}

function renderLanes(){
  const opened=[...document.querySelectorAll('.card.open')].map(c=>c.dataset.id);
  const searching=!!fQ;
  $('#lanes').innerHTML=LANES.map(L=>{
    const full=items.filter(i=>i.l===L.k && matches(i));
    const list=(more[L.k]||searching)?full:full.slice(0,CAP);
    const hid=full.length-list.length;
    return `<section class="lane fr ${fS!=='all'&&fS!==L.k?'off':''}" data-k="${L.k}">
      <div class="lh"><span class="dot"></span><h2>${L.t}</h2><span class="ct">${hid?list.length+'/'+full.length:full.length}</span></div>
      <div class="lb2">${full.length?list.map(i=>`
        <article class="card ${opened.includes(i.id)?'open':''}${i.id===active?' now':''}" data-id="${esc(i.id)}">
          <div class="nm">${esc(i.n)}</div>
          <div class="st">${esc(i.s)}</div>
          <div class="tgs">${i.tags.map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div>
          <div class="bw"><i style="width:${i.p}%"></i></div>
          <div class="exp">
            <div class="ttl">Siguiente paso</div>
            <textarea data-x="${esc(i.id)}">${esc(i.x)}</textarea>
            <div class="ttl">Progreso</div>
            <div class="ctl">
              <button class="btn" data-d="-5" data-p="${esc(i.id)}">-5</button>
              <span class="pc">${i.p}%</span>
              <button class="btn" data-d="5" data-p="${esc(i.id)}">+5</button>
            </div>
            <div class="ttl">Mover a</div>
            <div class="mv">${LANES.filter(x=>x.k!==i.l).map(x=>
              `<button class="btn" data-m="${esc(i.id)}" data-l="${x.k}">${x.t}</button>`).join('')}
              <button class="btn" data-del="${esc(i.id)}">Borrar</button></div>
            ${i.id===active
              ? '<button class="btn swap" disabled>&#9632; Universo actual</button>'
              : `<button class="btn swap" data-swap="${esc(i.id)}">&iquest;Cambiar de universo?</button>`}
          </div>
        </article>`).join('')+(full.length>CAP&&!searching?`<div class="morebar"><button class="btn" data-more="${L.k}">${more[L.k]?'- Ver menos':'+ Ver '+hid+' mas'}</button></div>`:''):'<div style="color:var(--faint);font-size:17px;padding:6px 2px">Vacio</div>'}
      </div></section>`;
  }).join('');

  const n=items.filter(matches).length;
  $('#qn').textContent = fQ ? n+' de '+items.length+' coinciden' : items.length+' titulos';
}

function renderXp(){
  const tot=items.length?Math.round(items.reduce((a,b)=>a+b.p,0)/items.length):0;
  $('#xpf').style.width=tot+'%'; $('#xpn').textContent=tot+'%';
}

function render(){pickActive();renderDash();renderLanes();renderXp()}

/* ---------------- eventos: dashboard ---------------- */
$('#dash').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('a'))return;                       // dejar pasar los enlaces

  if(t.closest('[data-close]')){open=false;renderDash();return}

  const sp=t.closest('[data-sp]');
  if(sp){const it=byId(sp.dataset.sp);const d=+sp.dataset.d;
    it.p=d===100?100:Math.max(0,Math.min(100,it.p+d));render();save();return}

  const sm=t.closest('[data-sm]');
  if(sm){byId(sm.dataset.sm).l=sm.dataset.l;render();save();return}

  const as=t.closest('[data-addstat]');
  if(as){const it=byId(as.dataset.addstat);
    const k=$('#skk').value.trim(), v=$('#svv').value.trim();
    if(!k&&!v)return;
    it.stats.push({k:(k||'DATO').toUpperCase(),v:v||'-'});renderScreen();save();return}

  const rs=t.closest('[data-rmstat]');
  if(rs){byId(rs.dataset.rmstat).stats.splice(+rs.dataset.ix,1);renderScreen();save();return}

  const al=t.closest('[data-addlink]');
  if(al){const it=byId(al.dataset.addlink);
    const tt=$('#lkt').value.trim(), uu=safeUrl($('#lku').value);
    if(!uu){flash('Enlace invalido');return}
    it.links.push({t:tt||'Link',u:uu});renderScreen();save();return}

  const rl=t.closest('[data-rmlink]');
  if(rl){byId(rl.dataset.rmlink).links.splice(+rl.dataset.ix,1);renderScreen();save();return}

  const fo=t.closest('[data-focus]');
  if(fo){
    const id=fo.dataset.focus;
    if(open&&focus===id){open=false} else {focus=id;open=true}
    renderDash();return;
  }
});
$('#dash').addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.lore){byId(el.dataset.lore).lore=el.value;save();return}
  if(el.dataset.sx){byId(el.dataset.sx).x=el.value;save();return}
});

/* ---------------- eventos: backlog ---------------- */
$('#lanes').addEventListener('click',e=>{
  const t=e.target;
  const pb=t.closest('[data-p]');
  if(pb){const it=byId(pb.dataset.p);it.p=Math.max(0,Math.min(100,it.p+ +pb.dataset.d));render();save();return}
  const mb=t.closest('[data-m]');
  if(mb){byId(mb.dataset.m).l=mb.dataset.l;render();save();return}
  const db=t.closest('[data-del]');
  if(db){const id=db.dataset.del;items=items.filter(i=>i.id!==id);
    if(active===id)active=null; if(focus===id){focus=null;open=false}
    buildRails();render();save();return}
  const mo=t.closest('[data-more]');
  if(mo){more[mo.dataset.more]=!more[mo.dataset.more];renderLanes();return}
  const sw=t.closest('[data-swap]');
  if(sw){
    const it=byId(sw.dataset.swap);
    it.last=Date.now(); active=it.id; focus=it.id; open=true;
    render();save();flash('Universo cargado');
    $('#dash').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(t.tagName==='TEXTAREA')return;
  const c=t.closest('.card'); if(c)c.classList.toggle('open');
});
$('#lanes').addEventListener('input',e=>{
  const x=e.target.dataset.x; if(!x)return;
  byId(x).x=e.target.value; save();
});

$('#rs').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;fS=b.dataset.s;buildRails();renderLanes()});
$('#rt').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;fT=b.dataset.t;buildRails();renderLanes()});
$('#q').addEventListener('input',e=>{fQ=e.target.value.trim().toLowerCase();renderLanes()});

$('#addb').addEventListener('click',()=>{
  const n=$('#ni').value.trim(); if(!n)return;
  const tg=$('#ti').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  items.unshift({id:'g'+Date.now(),l:'cold',p:0,n,tags:tg.length?tg:['nuevo'],
    s:'Recien agregado',x:'Sin notas todavia.',lore:'',stats:[],links:[],last:0});
  $('#ni').value='';$('#ti').value='';
  buildRails();render();save();
});

pull().then(()=>{buildRails();render()});
})();
